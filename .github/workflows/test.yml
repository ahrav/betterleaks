name: Test

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  test:
    strategy:
      matrix:
        platform: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.platform }}
    steps:
      # v6.0.2 (https://github.com/actions/checkout/releases/tag/v6.0.2)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        # v6.3.0 (https://github.com/actions/setup-go/releases/tag/v6.3.0)
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version: "1.25"

      - name: Build (portable, default)
        run: go build ./...

      - name: Set up gotestsum
        # https://github.com/gotestyourself/gotestsum/releases
        run: |
          go install gotest.tools/gotestsum@v1.13.0

      # --race is load-bearing, not belt-and-braces: the parallel dir walk
      # (hand-rolled condvar pool), the shared exprruntime programs, and the
      # pooled decoder/env maps are only meaningfully verified under the
      # race detector. The golden findings-digest test (detect/) and the
      # parser differential suites (sources/) run as part of ./...
      - name: Test
        run: |
          gotestsum --raw-command -- go test -json ./... --race

      # Regression fuzz: replays the committed corpus (including the inputs
      # that found the malformed-stream parser divergences) plus a short
      # exploration budget.
      - name: Fuzz smoke (parser)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          go test -fuzz='^FuzzFastParseGitLogRobustness$' -fuzztime=30s ./sources/
          go test -fuzz='^FuzzFastParseGitLogDifferential$' -fuzztime=30s ./sources/

      # - name: Validate Config
      #   run: go generate ./... && git diff --exit-code
